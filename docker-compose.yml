version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  backend:
    build: ./WebApplication5
    ports:
      - "5072:5072"
    environment:
      ASPNETCORE_URLS: "http://+:5072"
      ConnectionStrings__InvoiceManagerDBConnectionString: "Server=db,1433;Database=InvoiceManagerDB;User Id=sa;Password=password123!;TrustServerCertificate=True"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend